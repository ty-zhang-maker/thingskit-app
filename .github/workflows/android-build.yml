name: Build ThingsKit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (最新稳定版)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64 --dart-define-from-file configs.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThingsKit-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
